<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Що в холодильнику?</title>
<style>
:root{--bg:#f1f4f8;--card:#fff;--bd:#dde3ea;--tx:#1f2d3d;--mu:#7a8794;--pr:#1f9d6b;--prd:#17825a;--chip:#e3f5ec;--chf:#17825a;--off:#eef1f5;--bad:#d64545;--hd:#1b2b3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181f;--card:#1a252f;--bd:#2c3a47;--tx:#e6edf3;--mu:#8fa0af;--chip:#17372b;--chf:#5fd4a2;--off:#25323e;--hd:#0b1219;--bad:#ff7b7b}}
:root[data-theme="dark"]{--bg:#10181f;--card:#1a252f;--bd:#2c3a47;--tx:#e6edf3;--mu:#8fa0af;--chip:#17372b;--chf:#5fd4a2;--off:#25323e;--hd:#0b1219;--bad:#ff7b7b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--hd);color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:clamp(1.1rem,3.5vw,1.5rem);margin:0;flex:1 1 200px}
button,select,input,textarea{font:inherit;color:inherit}
.b{border:0;border-radius:10px;padding:9px 14px;background:var(--off);cursor:pointer;color:var(--tx)}
.b.p{background:var(--pr);color:#fff;font-weight:600}.b.p:hover{background:var(--prd)}
.b.d{color:var(--bad)}
.wrap{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
@media (max-width:860px){.wrap{grid-template-columns:1fr;padding:12px}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.c h2{font-size:1rem;margin:0 0 10px}
.row{display:flex;gap:8px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--off);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.9rem;border:0}
.chip.on{background:var(--chip);color:var(--chf)}
.hint{color:var(--mu);font-size:.85rem;margin:8px 0 0}
.f{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.ck{display:flex;gap:8px;align-items:center;margin-top:8px}.ck input{width:auto}
summary{font-weight:600;cursor:pointer;margin-bottom:8px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.top select{width:auto}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.rc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer}
.rc:hover{border-color:var(--pr)}.rc.full{border-color:var(--pr);background:var(--chip)}
.rt{display:flex;justify-content:space-between;gap:8px}.rt h3{margin:0;font-size:1.02rem}
.fv{background:none;border:0;font-size:1.3rem;cursor:pointer;color:#e6a700;padding:0 4px}
.mt{color:var(--mu);font-size:.85rem;margin:4px 0 8px}
.bar{height:6px;background:var(--off);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.ms{font-size:.85rem;margin-top:6px}
dialog{border:0;border-radius:16px;padding:0;width:min(720px,calc(100% - 20px));max-height:92dvh;background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dc{padding:20px;overflow:auto;max-height:92dvh}
.dc h2{margin:0 0 4px;font-size:1.4rem}
.dc h4{margin:16px 0 6px;color:var(--chf)}
.dc li{margin:3px 0}.bad{color:var(--bad);font-weight:600}.ok{color:var(--pr)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.empty{text-align:center;color:var(--mu);padding:40px 10px;grid-column:1/-1}
@media (max-width:520px){dialog{width:100%;max-height:100dvh;height:100dvh;border-radius:0}.dc{max-height:100dvh}}
:root{--g1:#e6f7ef;--g2:#e4ecfb;--dot:rgba(31,157,107,.2);--glow:rgba(31,157,107,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#08171a;--g2:#0c1530;--dot:rgba(95,212,162,.14);--glow:rgba(46,230,166,.35)}}
:root[data-theme="dark"]{--g1:#08171a;--g2:#0c1530;--dot:rgba(95,212,162,.14);--glow:rgba(46,230,166,.35)}
@property --a{syntax:"<number>";inherits:false;initial-value:0}
body{background:linear-gradient(135deg,var(--g1),var(--g2)) fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:24px 24px}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(50px);opacity:.55;background:radial-gradient(40% 40% at 20% 20%,var(--glow),transparent 70%),radial-gradient(35% 35% at 80% 70%,rgba(56,189,248,.4),transparent 70%);animation:drift 20s ease-in-out infinite alternate}
header{background:linear-gradient(120deg,var(--hd),#0f3d3a);position:relative;overflow:hidden;animation:fall .7s cubic-bezier(.2,.8,.2,1) both}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#2ee6a6,#38bdf8,transparent);background-size:200%;animation:shine 4s linear infinite}
header h1{background:linear-gradient(90deg,#fff,#6ef2c0,#7dd3fc,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.b{transition:transform .15s,background .2s,box-shadow .2s}.b:hover{transform:translateY(-1px)}.b:active{transform:scale(.95)}
.b.p{box-shadow:0 0 20px -4px var(--pr)}
.c{background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px -18px rgba(0,0,0,.5);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
aside .c:nth-child(2){animation-delay:.1s}aside .c:nth-child(3){animation-delay:.2s}
.c h2{display:flex;align-items:center;gap:10px;letter-spacing:.04em;text-transform:uppercase;font-size:.85rem;color:var(--chf)}
.c h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--pr),transparent)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 25%,transparent)}
.chip{transition:transform .15s,background .2s,box-shadow .2s}.chip:hover{transform:translateY(-2px)}.chip:active{transform:scale(.92)}
.chip.on{box-shadow:0 0 14px -3px var(--pr)}
#sel .chip{animation:pop .3s cubic-bezier(.2,.9,.3,1.4) both}
#sum{padding:6px 14px;border-radius:99px;background:var(--chip);color:var(--chf);font-size:.9rem}
.rc{display:grid;grid-template-columns:58px 1fr;column-gap:12px;align-items:start;background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.rc>*{grid-column:2}.rc>.rg{grid-column:1;grid-row:1/span 4;align-self:center}
.rc:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 14px 34px -14px var(--glow);border-color:var(--pr)}
.rc:active{transform:scale(.98)}
.rc.full{animation:rise .55s cubic-bezier(.2,.8,.2,1) both,glow 2.8s ease-in-out 1s infinite;animation-delay:var(--d,0ms),1s}
.bar{display:none}
.rg{--a:var(--p);width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;position:relative;background:conic-gradient(var(--rc,var(--pr)) calc(var(--a)*1%),var(--off) 0);animation:fill 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
.rg::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.rg{isolation:isolate}.rg>*{position:relative}
.rg.e{font-size:1.6rem;background:var(--off);animation:none}
.rg.e::before{display:none}
.fv{transition:transform .2s cubic-bezier(.2,.9,.3,1.6)}.fv:hover{transform:scale(1.25) rotate(-8deg)}.fv:active{transform:scale(.8)}
dialog[open]{animation:pop .35s cubic-bezier(.2,.9,.3,1.15);box-shadow:0 30px 80px -20px rgba(0,0,0,.6);border:1px solid var(--bd)}
dialog[open]::backdrop{animation:fade .3s both;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dc li{animation:slide .4s cubic-bezier(.2,.8,.2,1) both}
.dc li:nth-child(2){animation-delay:.05s}.dc li:nth-child(3){animation-delay:.1s}.dc li:nth-child(4){animation-delay:.15s}.dc li:nth-child(5){animation-delay:.2s}.dc li:nth-child(6){animation-delay:.25s}.dc li:nth-child(n+7){animation-delay:.3s}
.dc h2{background:linear-gradient(90deg,var(--tx),var(--chf));-webkit-background-clip:text;background-clip:text;color:transparent}
.empty{animation:rise .5s both}
@media (max-width:520px){dialog[open]{animation:sheet .4s cubic-bezier(.2,.8,.2,1)}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fall{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes fill{from{--a:0}}
@keyframes shine{from{background-position:0 0}to{background-position:200% 0}}
@keyframes drift{from{transform:translate(-3%,-2%) rotate(0)}to{transform:translate(3%,3%) rotate(8deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 26px -4px var(--glow)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.rc{position:relative;animation-fill-mode:backwards;transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.rc.full{animation-fill-mode:backwards,none}
.rc:hover{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-4px) scale(1.015)}
.rc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.2),transparent 60%)}
.rc:hover::after{opacity:1}
.b{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
#sum.bump{animation:bump .5s cubic-bezier(.2,.9,.3,1.5)}
@keyframes bump{40%{transform:scale(1.12)}}
#sp{position:fixed;inset:0;z-index:999;display:grid;place-content:center;justify-items:center;gap:14px;background:linear-gradient(135deg,#08171a,#0c1530);color:#fff;transition:opacity .6s,transform .6s}
#sp.out{opacity:0;transform:scale(1.08);pointer-events:none}
.sg{font-size:4.5rem;animation:flip 1.2s ease-in-out infinite;filter:drop-shadow(0 0 24px #2ee6a6)}
.st{letter-spacing:.12em;opacity:.8}
.sl{width:180px;height:3px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
.sl i{display:block;height:100%;background:linear-gradient(90deg,#2ee6a6,#38bdf8);animation:ld 1.2s ease-out both}
@keyframes flip{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-18px) rotate(12deg)}}
@keyframes ld{from{width:0}to{width:100%}}
.fls{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.fls span{position:absolute;bottom:-12%;opacity:0;animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.28}50%{transform:translate(30px,-60vh) rotate(180deg)}90%{opacity:.2}100%{transform:translate(-20px,-125vh) rotate(360deg);opacity:0}}
dialog{overflow:visible}
.cf{position:fixed;width:8px;height:12px;border-radius:2px;z-index:200;pointer-events:none}
</style>
</head>
<body>
<header>
<h1>🍳 Що в холодильнику?</h1>
<button class="b" id="rnd">🎲 Що приготувати?</button>
<button class="b p" id="addb">➕ Свій рецепт</button>
</header>
<div class="wrap">
<aside>
<div class="c"><h2>🥕 Мої продукти</h2>
<div class="row"><input id="in" list="dl" placeholder="яйця, молоко, борошно…" autocomplete="off" enterkeyhint="done"><button class="b p" id="ad">Додати</button></div>
<datalist id="dl"></datalist>
<p class="hint">Можна кілька через кому. Натисніть на продукт, щоб прибрати.</p>
<div class="chips" id="sel"></div>
<div class="row" style="margin-top:10px"><button class="b" id="clr">Очистити все</button></div></div>
<div class="c"><h2>⚡ Швидке додавання</h2><div class="chips" id="qk"></div></div>
<div class="c"><details id="fl" open><summary>🎛 Фільтри</summary>
<div class="f"><label for="fd">Складність</label><select id="fd"></select>
<label for="fc">Категорія</label><select id="fc"></select>
<label for="ft">Час</label><select id="ft"><option value="">Будь-який</option><option value="15">до 15 хв</option><option value="30">до 30 хв</option><option value="60">до 60 хв</option></select>
<label for="fm">Бракує до</label><select id="fm"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option><option>6</option></select>
<label for="fq">Назва</label><input id="fq" placeholder="пошук за назвою"></div>
<label class="ck"><input type="checkbox" id="fst" checked> Сіль, вода, олія, перець завжди є</label>
<label class="ck"><input type="checkbox" id="ff"> ★ Лише обране</label></details></div>
</aside>
<section>
<div class="top"><b id="sum"></b><select id="so"><option value="m">Спочатку найкращий збіг</option><option value="t">Найшвидші</option><option value="d">Найпростіші</option><option value="n">За назвою</option></select></div>
<div id="list"></div>
</section>
</div>

<dialog id="dlg"><div class="dc" id="dc"></div></dialog>
<dialog id="adlg"><form class="dc" id="af">
<h2>Новий рецепт</h2>
<p><label>Назва<input id="a1" required></label></p>
<div class="row"><label style="flex:1">Категорія<select id="a2"></select></label><label style="flex:1">Складність<select id="a3"></select></label><label style="flex:1">Хвилин<input id="a4" type="number" min="1" value="30"></label></div>
<p><label>Інгредієнти (через кому)<input id="a5" required></label></p>
<p><label>Кроки (кожен з нового рядка)<textarea id="a6" rows="6" required></textarea></label></p>
<div class="acts"><button class="b p" type="submit">Зберегти</button><button class="b" type="button" id="ac">Скасувати</button></div>
</form></dialog>

<script>
const EMOJI=["🍳","🍲","🥣","🥗","🥪","🥧","🍰"];const CATS=["Сніданки","Основні страви","Супи","Салати","Закуски","Випічка","Десерти"],DIFF=["Легко","Середньо","Складно"];
// Формат: назва|категорія|складність|хвилини|інгредієнти|кроки
const RAW=[
"Оладки на кефірі|5|0|20|кефір,борошно,яйця,цукор,сіль,сода,олія|Змішайте всі інгредієнти в густе тісто;Смажте на олії до золотистого кольору",
"Піца на сковороді|1|1|20|яйця,сметана,борошно,ковбаса,сир,помідори,кетчуп|Змішайте яйця, сметану, борошно для тіста;Вилийте на сковороду, змастіть кетчупом;Додайте начинку й сир, накрийте на 10 хв",
"Борщ класичний|2|2|90|буряк,капуста,картопля,морква,цибуля,м’ясо,томатна паста,сіль|Зваріть бульйон з м’яса;Засмажте цибулю, моркву, буряк з пастою;Додайте картоплю, потім капусту й засмажку",
"Олів’є|3|1|50|картопля,морква,яйця,ковбаса,огірки,горошок,майонез|Відваріть картоплю, моркву, яйця;Наріжте кубиками, додайте горошок;Заправте майонезом",
"Овочевий салат|3|0|10|огірки,помідори,цибуля,олія,сіль|Наріжте овочі;Заправте олією й посоліть",
"Грецький салат|3|0|10|огірки,помідори,бринза,оливки,олія|Грубо наріжте овочі й бринзу;Додайте оливки, полийте олією",
"Салат з капусти|3|0|10|капуста,морква,олія,сіль,оцет|Нашаткуйте капусту, потріть моркву;Посоліть, пом’яте, додайте оцет і олію",
"Плов|1|1|60|рис,м’ясо,морква,цибуля,часник,олія,сіль|Обсмажте м’ясо з цибулею й морквою;Всипте рис, залийте водою;Тушкуйте під кришкою 25 хв",
"Деруни|1|1|30|картопля,яйця,борошно,цибуля,олія,сіль|Натріть картоплю з цибулею, злийте сік;Додайте яйце й борошно;Смажте до скоринки",
"Вареники з картоплею|1|2|60|борошно,картопля,цибуля,яйця,олія,сіль,вода|Замісіть тісто;Зробіть начинку з пюре й цибулі;Ліпіть і варіть 5 хв після спливання",
"Французькі тости|0|0|15|хліб,яйця,молоко,цукор,масло|Збийте яйця з молоком і цукром;Вмочіть хліб, смажте на маслі",
"Паста карбонара|1|1|25|макарони,бекон,яйця,сир,перець,сіль|Відваріть пасту, обсмажте бекон;Змішайте яйця з сиром;З’єднайте все гарячим",
"Курка запечена з картоплею|1|1|70|курка,картопля,часник,олія,сіль,перець|Натріть курку спеціями й олією;Викладіть з картоплею на деко;Запікайте при 200°C 55 хв",
"Бананові оладки|6|0|15|банан,яйця,борошно|Розімніть банан;Додайте яйце й борошно;Смажте на сухій сковороді",
"Шарлотка|5|1|60|яблука,яйця,цукор,борошно|Збийте яйця з цукром, додайте борошно;Викладіть яблука, залийте тістом;Випікайте 40 хв при 180°C",
"Тушкована капуста|1|0|40|капуста,морква,цибуля,томатна паста,олія,сіль|Обсмажте цибулю з морквою;Додайте капусту й пасту;Тушкуйте 30 хв",
"Вівсяне печиво|6|1|30|вівсянка,борошно,цукор,яйця,масло|Змішайте масло з цукром і яйцем;Додайте пластівці та борошно;Випікайте 15 хв при 180°C",
"Котлети з фаршу|1|1|40|фарш,цибуля,яйця,хліб,молоко,олія,сіль|Змішайте фарш, цибулю, яйце, замочений хліб;Сформуйте й обсмажте з двох боків",

function tm(a,b){a=cn(a);b=cn(b);if(a===b)return true;const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;let p=0;while(p<la&&p<lb&&a[p]===b[p])p++;return p>=Math.max(3,Math.max(la,lb)-2)}

r.i.forEach(g=>{const gt=toks(g);if(st&&gt.some(t=>ST.includes(cn(t))))stp.push(g);else if(gt.some(t=>ut.some(u=>tm(u,t))))have.push(g);else miss.push(g)});
return{r,have,stp,miss,pct:Math.floor((have.length+stp.length)*100/Math.max(r.i.length,1))}}
